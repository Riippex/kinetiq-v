# Product contract v0.1.0. Fields land incrementally in the executable API.
scalar DateTime

enum SessionState { READY ACTIVE PAUSED COMPLETED ABANDONED }
enum PauseReason { USER_REQUEST VISIBILITY TARGET_AMBIGUOUS CAMERA_DISCONNECTED }
enum SessionMode { NORMAL DYNAMIC }
enum SessionIntensity { LIGHTER PLANNED CHALLENGING }
enum CoachingTone { CALM TECHNICAL MOTIVATIONAL EDGY }
enum DynamicChallengeType { HOLD_POSE MIRROR_POSE QUICK_REPS RECOVERY }
enum DynamicChallengeFrequency { LOW STANDARD HIGH }
enum DynamicChallengeStatus { PENDING COMPLETED SKIPPED }
enum ExperienceLevel { STARTING RETURNING REGULAR }
enum VisibilityStatus { VISIBLE PARTIALLY_VISIBLE NOT_VISIBLE }
type DynamicChallenge {
  id: ID!
  challengeType: DynamicChallengeType!
  exerciseId: String!
  targetValue: Int!
  description: String!
  setOrder: Int!
  status: DynamicChallengeStatus!
}
input SkipDynamicChallengeInput {
  sessionId: ID!
  expectedRevision: Int!
  challengeId: ID!
  clientMutationId: String!
}
type SkipDynamicChallengeResult {
  challenges: [DynamicChallenge!]!
  errors: [DomainError!]!
}
type Profile {
  id: ID!
  displayName: String!
  timezone: String!
  experienceLevel: ExperienceLevel!
  availabilityDaysPerWeek: Int!
  targetSessionMinutes: Int!
  availableEquipment: [String!]!
  workoutSpace: String!
  preferences: [String!]!
  exclusions: [String!]!
  limitations: [String!]!
  coachingTone: CoachingTone!
  updatedAt: DateTime!
}
input UpdateProfileInput {
  displayName: String
  timezone: String
  experienceLevel: ExperienceLevel
  availabilityDaysPerWeek: Int
  targetSessionMinutes: Int
  availableEquipment: [String!]
  workoutSpace: String
  preferences: [String!]
  exclusions: [String!]
  limitations: [String!]
  coachingTone: CoachingTone
}
type ProfileResult { profile: Profile errors: [DomainError!]! }
type Goal { id: ID! revision: Int! description: String! measure: String baseline: Float target: Float unit: String createdAt: DateTime! }
input SetGoalInput {
  goalId: ID
  description: String!
  measure: String
  baseline: Float
  target: Float
  unit: String
}
type GoalResult { goal: Goal errors: [DomainError!]! }
type Exercise { id: ID! version: Int! name: String! visionSupported: Boolean! }
type RoutineItem { exercise: Exercise! order: Int! sets: Int! repetitions: Int durationSeconds: Int }
type Routine { id: ID! version: Int! title: String! rationale: String! items: [RoutineItem!]! accepted: Boolean! }
type DynamicSessionConfiguration {
  frequency: DynamicChallengeFrequency!
  allowedChallengeTypes: [DynamicChallengeType!]!
  scoringEnabled: Boolean!
  narrationEnabled: Boolean!
}
type SessionConfiguration {
  requestedMode: SessionMode!
  activeMode: SessionMode!
  intensity: SessionIntensity!
  coachingTone: CoachingTone!
  captureDeviceId: ID!
  displayDeviceId: ID
  promptForProgressPhoto: Boolean!
  dynamic: DynamicSessionConfiguration
}
type PerformedSet {
  exerciseId: ID!
  setOrder: Int!
  repetitions: Int
  durationSeconds: Int
}
type ObservationCoverage {
  coverageRatio: Float!
  trackedSeconds: Int!
  totalSeconds: Int!
  fullyVisibleRatio: Float!
  untrackedReasons: [String!]!
}
type SessionFeedback {
  perceivedEffort: Int
  comments: String
}
type WorkoutSession {
  id: ID!
  revision: Int!
  routine: Routine!
  state: SessionState!
  configuration: SessionConfiguration!
  pauseReason: PauseReason
  confirmedRepetitions: Int!
  performedSets: [PerformedSet!]!
  observationCoverage: ObservationCoverage
  feedback: SessionFeedback
  updatedAt: DateTime!
  targetPersonId: String
}
type SessionPage { nodes: [WorkoutSession!]! endCursor: String hasNextPage: Boolean! }
type VisionCandidate { candidateId: String! confidence: Float! }
# TransientSessionUpdate is server-produced only (published exclusively
# by PollVisionObservationsUseCase polling real Vision observations).
# There is deliberately no client-facing input/mutation for it: an
# earlier publishTransientSessionUpdate mutation let any authenticated
# owner of a session with a confirmed target submit arbitrary values,
# forging a "live Vision result" -- removed rather than access-controlled
# further. Read access (transientSessionState, transientSessionUpdates)
# remains available and stays scoped to the session's owner.
type TransientSessionUpdate {
  sessionId: ID!
  activeExerciseId: ID
  currentRepetitions: Int
  currentDurationSeconds: Int
  poseConfidence: Float
  visibilityStatus: VisibilityStatus!
  timestamp: String
}
type ProgressSummary { completedSessions: Int! partialSessions: Int! from: DateTime! to: DateTime! }
input RoutineContext { goalId: ID! minutes: Int! equipment: [String!]! excludedExerciseIds: [ID!]! }
input SessionCommand { sessionId: ID! expectedRevision: Int! idempotencyKey: String! }
input PerformedSetInput {
  exerciseId: ID!
  setOrder: Int!
  repetitions: Int
  durationSeconds: Int
}
input ObservationCoverageInput {
  coverageRatio: Float!
  trackedSeconds: Int!
  totalSeconds: Int!
  fullyVisibleRatio: Float = 1.0
  untrackedReasons: [String!] = []
}
input SessionFeedbackInput {
  perceivedEffort: Int
  comments: String
}
input DynamicSessionConfigurationInput {
  frequency: DynamicChallengeFrequency! = STANDARD
  allowedChallengeTypes: [DynamicChallengeType!]!
  scoringEnabled: Boolean! = true
  narrationEnabled: Boolean! = true
}
input PrepareSessionInput {
  routineId: ID!
  routineVersion: Int!
  mode: SessionMode!
  intensity: SessionIntensity! = PLANNED
  coachingTone: CoachingTone!
  captureDeviceId: ID!
  displayDeviceId: ID
  promptForProgressPhoto: Boolean! = true
  dynamic: DynamicSessionConfigurationInput
  idempotencyKey: String!
}
type DomainError { code: String! message: String! field: String }
type SessionResult { session: WorkoutSession errors: [DomainError!]! }
type PairingChallenge { id: ID! userCode: String! expiresAt: DateTime! }
type PairingResult { approved: Boolean! errors: [DomainError!]! }
type UploadRequest { photoId: ID! uploadUrl: String! expiresAt: DateTime! }
type UploadRequestResult { uploadRequest: UploadRequest errors: [DomainError!]! }
type ProgressPhoto {
  id: ID!
  sessionId: ID
  contentType: String!
  byteLength: Int!
  url: String!
  status: String!
  createdAt: DateTime!
  confirmedAt: DateTime
}
type ProgressPhotoResult { photo: ProgressPhoto errors: [DomainError!]! }
type DeletePhotoResult { success: Boolean! errors: [DomainError!]! }
type ServiceStatus { name: String! version: String! ready: Boolean! }
enum DisplayDeviceType { FIRE_TV VEGA_OS }
enum DisplayPairingStatus { UNPAIRED PAIRED EXPIRED }
type DisplayPairingCode {
  code: String!
  deviceType: DisplayDeviceType!
  createdAt: String!
  expiresAt: String!
  status: DisplayPairingStatus!
  pairedSessionId: ID
}
type DisplaySessionState {
  sessionId: ID
  deviceType: DisplayDeviceType!
  status: DisplayPairingStatus!
  mode: SessionMode
  intensity: SessionIntensity
  state: String
  activeExercise: String
  confirmedReps: Int!
  visibilityStatus: VisibilityStatus
  pauseReason: String
}
enum EvidenceSource { MEASURED SELF_REPORTED ESTIMATED MISSING }
enum PerformanceTrend { IMPROVING STABLE DECLINING INSUFFICIENT_DATA }
type ConsistencyMetric {
  totalSessions: Int!
  plannedSessions: Int!
  consistencyRatio: Float!
  currentStreakDays: Int!
  completedCount: Int!
  abandonedCount: Int!
  skippedCount: Int!
}
type PerformanceProjection {
  exerciseId: ID!
  exerciseName: String!
  measuredVolume: Int!
  selfReportedVolume: Int!
  estimated1RM: Float
  evidenceSource: EvidenceSource!
  trend: PerformanceTrend!
}
type GoalProgress {
  goalId: ID
  description: String
  baseline: Float
  target: Float
  currentValue: Float
  unit: String
  progressRatio: Float
  evidenceSource: EvidenceSource!
}
type ProgressSummary {
  fromDate: DateTime!
  toDate: DateTime!
  consistency: ConsistencyMetric!
  performanceProjections: [PerformanceProjection!]!
  goalProgress: GoalProgress
}
type Query {
  serviceStatus: ServiceStatus!
  me: Profile!
  goals: [Goal!]!
  activeGoal: Goal
  session(id: ID!): WorkoutSession
  sessions(first: Int! = 20, after: String): SessionPage!
  progress(from: DateTime!, to: DateTime!): ProgressSummary!
  visionCandidates(sessionId: ID!): [VisionCandidate!]!
  transientSessionState(sessionId: ID!): TransientSessionUpdate
  sessionDynamicChallenges(sessionId: ID!): [DynamicChallenge!]!
  displaySessionState(code: String!): DisplaySessionState!
  progressPhotos(sessionId: ID): [ProgressPhoto!]!
}
type Mutation {
  updateProfile(input: UpdateProfileInput!): ProfileResult!
  setGoal(input: SetGoalInput!): GoalResult!
  suggestRoutine(context: RoutineContext!): Routine!
  acceptRoutine(id: ID!, version: Int!, idempotencyKey: String!): Routine!
  prepareSession(input: PrepareSessionInput!): SessionResult!
  startSession(command: SessionCommand!): SessionResult!
  startSessionVisionAnalysis(command: SessionCommand!): SessionResult!
  confirmSessionTarget(command: SessionCommand!, targetPersonId: String!): SessionResult!
  disableDynamicMode(command: SessionCommand!): SessionResult!
  pauseSession(command: SessionCommand!): SessionResult!
  resumeSession(command: SessionCommand!): SessionResult!
  finishSession(
    command: SessionCommand!
    performedSets: [PerformedSetInput!]
    observationCoverage: ObservationCoverageInput
    feedback: SessionFeedbackInput
  ): SessionResult!
  recordSessionFeedback(
    command: SessionCommand!
    feedback: SessionFeedbackInput!
  ): SessionResult!
  abandonSession(command: SessionCommand!): SessionResult!
  skipDynamicChallenge(input: SkipDynamicChallengeInput!): SkipDynamicChallengeResult!
  issueDisplayPairingCode(deviceType: DisplayDeviceType!): DisplayPairingCode!
  pairDisplayDevice(code: String!, sessionId: ID): DisplaySessionState!
  approveDisplay(userCode: String!, sessionId: ID!): PairingResult!
  requestProgressPhotoUpload(
    contentType: String!
    byteLength: Int!
    idempotencyKey: String!
    sessionId: ID
  ): UploadRequestResult!
  finalizeProgressPhoto(photoId: ID!): ProgressPhotoResult!
  deleteProgressPhoto(photoId: ID!): DeletePhotoResult!
}
type Subscription { transientSessionUpdates(sessionId: ID!): TransientSessionUpdate! }
