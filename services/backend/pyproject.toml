[project]
name = "kinetiq-backend"
version = "0.1.0"
description = "Kinetiq V modular product backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "channels>=4,<5",
    "channels-redis>=4,<5",
    "dj-database-url>=3,<4",
    "django>=5.2,<5.3",
    "django-redis>=6,<7",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.2,<2",
    "strawberry-graphql-django>=0.88.0",
    "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinetiq"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kinetiq.bootstrap.test_settings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "kinetiq.bootstrap.settings"

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
    "types-channels>=4.3.0.20260518",
]
