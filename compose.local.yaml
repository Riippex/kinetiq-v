# Separate local stack: never shares volumes with compose.yaml or AWS.
name: kinetiq-v-local
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: kinetiq
      POSTGRES_USER: kinetiq
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run tools/configure-local.py first}
    volumes: ["local_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetiq -d kinetiq"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    environment:
      REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD:?Run tools/configure-local.py first}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 128mb --maxmemory-policy noeviction"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  media:
    image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: kinetiq-media-local
    ports: ["127.0.0.1:9000:9090"]
    volumes: ["local_media:/s3mockroot"]
  backend:
    image: ${LOCAL_BACKEND_IMAGE:-kinetiq-v-backend:local}
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    env_file: .env.development-local
    environment:
      DATABASE_URL: postgresql://kinetiq:${LOCAL_POSTGRES_PASSWORD}@postgres:5432/kinetiq
      REDIS_URL: redis://:${LOCAL_REDIS_PASSWORD}@redis:6379/0
      VISION_BASE_URL: http://vision:8000
      MEDIA_S3_ENDPOINT_URL: http://host.docker.internal:9000
      # Sign directly for the client address; never rewrite an already signed URL.
      MEDIA_S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:9000
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["uvicorn", "kinetiq.bootstrap.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--lifespan", "on", "--reload"]
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./services/backend/src:/app/src:ro
      - ./contracts:/app/contracts:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      vision: {condition: service_started}
  vision:
    image: ${LOCAL_VISION_IMAGE:-kinetiq-v-vision:local}
    build:
      context: ../kinetiq-v-vision
    env_file: .env.development-local
    environment:
      VISION_ENV: local-real-inference
      VISION_WEIGHTS_DIR: /app/weights
    ports: ["127.0.0.1:8001:8000"]
    volumes:
      - ../kinetiq-v-vision/src:/app/src:ro
      - ../kinetiq-v-vision/model-manifests:/app/model-manifests:ro
      - ../kinetiq-v-vision/contracts:/app/contracts:ro
      - ../kinetiq-v-vision/weights:/app/weights:ro
  web:
    image: kinetiq-v-web:local-dev
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: deps
    env_file: .env.development-local
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      KINETIQ_BACKEND_GRAPHQL_URL: http://backend:8000/graphql/
      KINETIQ_PUBLIC_ORIGIN: http://localhost:3000
    command: ["npm", "run", "dev", "--workspace=@kinetiq/web", "--", "--hostname", "0.0.0.0"]
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/session-client:/app/packages/session-client:ro
      - local_next:/app/apps/web/.next
      - local_web_modules:/app/apps/web/node_modules
    depends_on: [backend]
volumes:
  local_postgres:
  local_media:
  local_next:
  local_web_modules:
